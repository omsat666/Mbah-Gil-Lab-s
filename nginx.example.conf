# ====================================================================
# Nginx Reverse Proxy Configuration Template (Ubuntu / Debian VPS)
# Simpan di: /etc/nginx/sites-available/research-assistant
# Lalu aktifkan: ln -s /etc/nginx/sites-available/research-assistant /etc/nginx/sites-enabled/
# ====================================================================

server {
    listen 80;
    server_name research.domainanda.com; # Ganti dengan domain Anda

    # Meningkatkan limit payload untuk upload file & data riset besar
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
